<!-- @dsCard group="Data" height=330 subtitle="The brand's one shape, at data scale" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Share bar</title></head>
<body>
<div class="kv-pad">
  <div class="small" style="color:var(--muted)">Budget: spent, left</div>
  <div class="share" style="--share-h:28px"><span class="spent" style="flex:7942 1 0"></span><span class="rest" style="flex:2058 1 0"></span></div>
  <div class="small" style="color:var(--muted)">Over budget: the target, then what went past it</div>
  <div class="share" style="--share-h:14px"><span class="spent" style="flex:1500 1 0"></span><span class="over" style="flex:104 1 0"></span></div>
  <div class="small" style="color:var(--muted)">Household split, 3 and 2, labelled by name</div>
  <div class="share labelled" style="--share-h:56px"><span style="flex:3 1 0;background:var(--member-1)">Alex 60%</span><span style="flex:2 1 0;background:var(--member-2)">Sam 40%</span></div>
  <div class="tile tile-1">
    <div class="lead">2 781,35 kr left of 13 400,00 kr</div>
    <div class="share" style="--share-h:36px"><span class="spent" style="flex:10618 1 0"></span><span class="rest" style="flex:2781 1 0"></span></div>
  </div>
</div>
</body>
</html>
