<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Leva cover</title>
<style>
  body { margin: 0; }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .f1 { fill: var(--field-1); }
  .f2 { fill: var(--field-2); }
  .rest { fill: var(--chart-rest); }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { font-family: var(--font-sans); font-weight: 600; font-size: 120px; line-height: 0.92; letter-spacing: -0.04em; color: var(--ink); margin: 0; }
  .tag { font-family: var(--font-sans); font-size: 14px; color: var(--muted); margin: 16px 0 0; }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <!--
      blocks: accent (180 × 230) and ink (140 × 230) = the mark's 18 : 11 share at cover scale; field-1 (148 × 136), field-2 (200 × 80)
      arrangement: one tall slab cut in two shares, bleeding off the top and right edge, two field satellites bleeding off the bottom
      pattern: the share itself (literal motif row) — five budget shares, ink spent and chart-rest left, cut by the space-share gap; chosen because the README makes the share the brand's only shape
      steps and radii: space-share 4px inside every share, 3 × space-share (12px) between the slab's parts, space-1 8px between bars, radius-none on every corner
    -->
    <rect class="accent" x="640" y="-10" width="180" height="230" />
    <rect class="ink" x="832" y="-10" width="140" height="230" />
    <rect class="f1" x="480" y="180" width="148" height="136" />
    <rect class="f2" x="640" y="232" width="200" height="80" />
    <rect class="ink" x="480" y="20" width="85" height="20" /><rect class="rest" x="569" y="20" width="59" height="20" />
    <rect class="ink" x="480" y="48" width="56" height="20" /><rect class="rest" x="540" y="48" width="88" height="20" />
    <rect class="ink" x="480" y="76" width="108" height="20" /><rect class="rest" x="592" y="76" width="36" height="20" />
    <rect class="ink" x="480" y="104" width="70" height="20" /><rect class="rest" x="554" y="104" width="74" height="20" />
    <rect class="ink" x="480" y="132" width="122" height="20" /><rect class="accent" x="606" y="132" width="22" height="20" />
  </svg>
  <div class="text">
    <p class="name">Leva</p>
    <p class="tag">Money, for the way you live.</p>
  </div>
</div>
</body>
</html>
